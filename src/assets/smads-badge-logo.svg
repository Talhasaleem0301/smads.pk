<svg width="248" height="252" viewBox="0 0 248 252" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="igGradBadge" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f9ce34"/>
      <stop offset="45%" stop-color="#ee2a7b"/>
      <stop offset="100%" stop-color="#6228d7"/>
    </linearGradient>
    <path id="badgeArcPath" d="M 65.1 162 A 68 68 0 0 0 182.9 162" fill="none"/>
  </defs>

  <!-- Outer rings -->
  <circle cx="124" cy="128" r="122" fill="#ffffff"/>
  <circle cx="124" cy="128" r="120.5" fill="none" stroke="#0f2460" stroke-width="2"/>
  <circle cx="124" cy="128" r="104" fill="none" stroke="#eab308" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- Connector spokes from icons to inner ring (subtle) -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="124" y1="70" x2="124" y2="32" />
    <line x1="185" y1="107" x2="215.3" y2="98.3" />
    <line x1="162" y1="176" x2="180.4" y2="205.7" />
    <line x1="86" y1="176" x2="67.6" y2="205.7" />
    <line x1="63" y1="107" x2="32.7" y2="98.3" />
  </g>

  <!-- Center wordmark -->
  <text x="124" y="113" text-anchor="middle" font-family="Sora, Arial, sans-serif" font-weight="700" font-size="21" letter-spacing="4" fill="#0f2460">SM</text>
  <text x="124" y="157" text-anchor="middle" font-family="Sora, Arial, sans-serif" font-weight="900" font-size="44" letter-spacing="1" fill="#eab308">ADS</text>

  <!-- Curved tagline -->
  <text font-family="Sora, Arial, sans-serif" font-weight="700" font-size="7.4" letter-spacing="0.6" fill="#0f2460">
    <textPath href="#badgeArcPath" startOffset="50%" text-anchor="middle">SOCIAL MEDIA ADVERTISER</textPath>
  </text>

  <!-- Facebook (upper-left) -->
  <g transform="translate(32.7,98.3)">
    <circle r="18" fill="#1877F2"/>
    <path d="M4.2 -9.5 h-3.3 a3.8 3.8 0 0 0 -3.8 3.8 v3.3 h-3.3 v4.7 h3.3 v10.4 h4.7 v-10.4 h3.1 l0.5 -4.7 h-3.6 v-2.8 c0 -0.9 0.3 -1.4 1.5 -1.4 h2.1 z" fill="#ffffff"/>
  </g>

  <!-- YouTube (top) -->
  <g transform="translate(124,32)">
    <circle r="18" fill="#FF0000"/>
    <rect x="-10.5" y="-7" width="21" height="14" rx="4" fill="#ffffff"/>
    <polygon points="-2.8,-3.8 -2.8,3.8 5.7,0" fill="#FF0000"/>
  </g>

  <!-- Instagram (upper-right) -->
  <g transform="translate(215.3,98.3)">
    <circle r="18" fill="url(#igGradBadge)"/>
    <rect x="-9" y="-9" width="18" height="18" rx="5.5" fill="none" stroke="#ffffff" stroke-width="1.7"/>
    <circle r="4.7" fill="none" stroke="#ffffff" stroke-width="1.7"/>
    <circle cx="6.2" cy="-6.2" r="1.3" fill="#ffffff"/>
  </g>

  <!-- WhatsApp (lower-right) -->
  <g transform="translate(180.4,205.7)">
    <circle r="18" fill="#25D366"/>
    <path d="M0 -10a10 10 0 0 0 -8.6 15.1L-10 10l4.7 -1.3a10 10 0 1 0 4.3 -18.1z" fill="#ffffff"/>
  </g>

  <!-- OLX (lower-left) -->
  <g transform="translate(67.6,205.7)">
    <circle r="18" fill="#6E2FA0"/>
    <text x="0" y="3.6" text-anchor="middle" font-family="Sora, Arial, sans-serif" font-weight="800" font-size="9.5" fill="#ffffff">OLX</text>
  </g>
</svg>
